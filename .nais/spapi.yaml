apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spapi
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  liveness:
    path: /internal/isalive
    initialDelay: 10
  readiness:
    path: /internal/isready
    initialDelay: 10
    periodSeconds: 1
  preStopHook:
    http:
      path: /internal/stop
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 50m
      memory: 512Mi
  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 400
  prometheus:
    enabled: true
    path: /internal/metrics
  maskinporten:
    enabled: true
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: spokelse
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
